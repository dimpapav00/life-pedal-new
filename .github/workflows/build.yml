name: Build VST3 Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

    - name: Build Plugin
      run: cmake --build build --config Release --parallel 4

    - name: Upload Windows VST3 Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: LifePedalVST-Windows
        path: build/LifePedalVST_artefacts/Release/VST3/LifePedalVST.vst3

    - name: Upload macOS VST3 Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: LifePedalVST-MacOS
        path: build/LifePedalVST_artefacts/Release/VST3/LifePedalVST.vst3
